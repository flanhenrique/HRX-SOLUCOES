name: Deploy HRX Solutions to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm install

      - name: Verify admin PWA shell
        run: npm run test:pwa

      - name: Build
        run: npm run build

      - name: Prepare direct admin PWA route
        run: |
          mkdir -p dist/admin/orcamentos
          cp dist/index.html dist/admin/orcamentos/index.html
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('dist/admin/orcamentos/index.html')
          html = path.read_text()
          locked_viewport = '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />'
          viewport_pattern = r"<meta\s+name=['\"]viewport['\"][^>]*>"
          if re.search(viewport_pattern, html, flags=re.IGNORECASE):
              html = re.sub(viewport_pattern, locked_viewport, html, count=1, flags=re.IGNORECASE)
          else:
              html = html.replace('<head>', f'<head>\n    {locked_viewport}')

          tags = [
              '<link rel="manifest" href="/admin/manifest.webmanifest" />',
              '<meta name="theme-color" content="#061a31" />',
              '<meta name="mobile-web-app-capable" content="yes" />',
              '<meta name="apple-mobile-web-app-capable" content="yes" />',
              '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />',
              '<meta name="apple-mobile-web-app-title" content="HRX Admin" />',
              '<link rel="apple-touch-icon" href="/admin/hrx-admin-icon.svg" />',
          ]
          tags_html = '\n    '.join(tags)
          html = html.replace('</head>', f'    {tags_html}\n  </head>')
          path.write_text(html)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
