name: Deploy HRX Solutions to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # O QA pesado (Chromium, axe e matriz responsiva) roda no PR em
      # .github/workflows/pwa-quality.yml. A publicação do main repete apenas
      # a regressão estática e o build para não atrasar a entrega de releases.
      - name: Verify admin PWA shell
        run: npm run test:pwa

      - name: Build
        run: npm run build

      - name: Prepare direct admin PWA routes and atomic release
        run: |
          mkdir -p dist/admin
          cp dist/index.html dist/admin/index.html
          for route in orcamentos clientes financeiro fiscal suspensoes atividades documentos paineis configuracoes visao-geral painels projetos; do
            mkdir -p "dist/admin/$route"
            cp dist/index.html "dist/admin/$route/index.html"
          done
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          import os
          import re

          build = f"{datetime.now(timezone.utc):%Y%m%d}.{os.environ['GITHUB_RUN_NUMBER']}"
          released_at = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')

          version_path = Path('dist/admin/version.json')
          version = json.loads(version_path.read_text()) if version_path.exists() else {}
          version.update({
              'release': build,
              'build': build,
              'releasedAt': released_at,
          })
          version.setdefault('message', 'Melhorias e correções do HRX Admin estão prontas para instalar.')
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=2) + '\n')

          sw_path = Path('dist/admin/sw.js')
          sw = sw_path.read_text()
          if '__HRX_ADMIN_BUILD__' not in sw:
              raise SystemExit('placeholder de build não encontrado no service worker do HRX Admin')
          sw_path.write_text(sw.replace('__HRX_ADMIN_BUILD__', build))

          admin_viewport = '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />'
          viewport_pattern = r"<meta\s+name=['\"]viewport['\"][^>]*>"
          build_tag = f'<script>globalThis.__HRX_ADMIN_BUILD__={json.dumps(build)};</script>'
          tags = [
              '<link rel="manifest" href="/admin/manifest.webmanifest" />',
              '<meta name="theme-color" content="#061a31" />',
              '<meta name="mobile-web-app-capable" content="yes" />',
              '<meta name="apple-mobile-web-app-capable" content="yes" />',
              '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />',
              '<meta name="apple-mobile-web-app-title" content="HRX Admin" />',
              '<link rel="apple-touch-icon" href="/admin/hrx-admin-icon.svg" />',
              build_tag,
          ]
          tags_html = '\n    '.join(tags)
          admin_routes = (
              '',
              'orcamentos',
              'clientes',
              'financeiro',
              'fiscal',
              'suspensoes',
              'atividades',
              'documentos',
              'paineis',
              'configuracoes',
              'visao-geral',
              'painels',
              'projetos',
          )

          for route in admin_routes:
              path = Path('dist/admin/index.html') if not route else Path(f'dist/admin/{route}/index.html')
              html = path.read_text()
              if re.search(viewport_pattern, html, flags=re.IGNORECASE):
                  html = re.sub(viewport_pattern, admin_viewport, html, count=1, flags=re.IGNORECASE)
              else:
                  html = html.replace('<head>', f'<head>\n    {admin_viewport}')
              html = html.replace('</head>', f'    {tags_html}\n  </head>')
              path.write_text(html)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
