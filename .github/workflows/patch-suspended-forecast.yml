name: Patch suspended forecast

on:
  push:
    branches:
      - agent/exclude-suspended-from-forecast
    paths:
      - tests/admin-suspended-forecast.test.mjs
      - .github/workflows/patch-suspended-forecast.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/exclude-suspended-from-forecast
      - name: Apply forecast rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/quotes/AdminQuotes.tsx')
          s = p.read_text()
          s = s.replace("status: 'awaiting_review' | 'needs_scope' | 'approved' | 'rejected';", "status: 'awaiting_review' | 'needs_scope' | 'approved' | 'rejected' | 'suspended';")
          s = s.replace("approved: 'Aprovado', rejected: 'Rejeitado', new: 'Novo'", "approved: 'Aprovado', rejected: 'Rejeitado', suspended: 'Suspenso', new: 'Novo'")
          s = s.replace("pipeline: requests.reduce((sum, item) => sum + (item.draft?.status === 'rejected' ? 0 : Number(item.draft?.final_amount ?? 0)), 0),", "pipeline: requests.reduce((sum, item) => sum + (item.draft?.status === 'rejected' || item.draft?.status === 'suspended' ? 0 : Number(item.draft?.final_amount ?? 0)), 0),")
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/quotes/AdminQuotes.tsx
          git commit -m "Excluir orçamentos suspensos da previsão"
          git push origin HEAD:agent/exclude-suspended-from-forecast
