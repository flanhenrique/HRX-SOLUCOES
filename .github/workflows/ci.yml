name: Validate HRX site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hrx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Verify admin PWA shell
        run: npm run test:pwa

      - name: Build
        run: npm run build
