name: HRX Admin PWA Quality Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pwa-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pwa-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Static and architecture regression tests
        run: npm run test:pwa

      - name: Build production bundle
        run: npm run build

      - name: Real-browser responsive and accessibility tests
        run: npm run test:browser
