<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">Login MAP.i Nexus</title>
  <desc id="desc">Demonstração da tela de login do NEXUS como aplicação corporativa de intranet e acesso restrito.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f3f72"/><stop offset="1" stop-color="#1f6ca8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#173b60" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1180" height="720" rx="28" fill="#f4f7fb"/>
  <rect x="0" y="0" width="460" height="720" rx="28" fill="url(#blue)"/>
  <path d="M0 565c110-76 222-88 460-22v177H0z" fill="#12375f" opacity=".42"/>
  <g transform="translate(62 76)" font-family="Arial,sans-serif">
    <text x="0" y="0" dominant-baseline="hanging" font-size="28" font-weight="800" fill="#fff">MAP.i</text>
    <text x="0" y="56" font-size="68" font-weight="800" letter-spacing="3" fill="#fff">NEXUS</text>
    <rect x="0" y="100" width="94" height="5" rx="3" fill="#61b8e9"/>
    <text x="0" y="162" font-size="20" font-weight="700" fill="#eaf5fd">Gestão comercial e operacional</text>
    <text x="0" y="198" font-size="15" fill="#c7e1f3">Informação centralizada para apoiar</text>
    <text x="0" y="223" font-size="15" fill="#c7e1f3">decisões, clientes, atividades e indicadores.</text>
    <g transform="translate(0 316)">
      <rect width="318" height="92" rx="18" fill="#fff" fill-opacity=".09" stroke="#fff" stroke-opacity=".13"/>
      <circle cx="34" cy="34" r="9" fill="#86d1f4"/><text x="58" y="31" font-size="12" font-weight="800" letter-spacing="1" fill="#dff1fb">INTRANET CORPORATIVA</text>
      <text x="58" y="57" font-size="14" fill="#fff">Ambiente interno · acesso restrito</text>
    </g>
    <text x="0" y="570" font-size="12" fill="#b8d7ea">NEXUS não possui acesso público na web.</text>
  </g>
  <g filter="url(#shadow)" transform="translate(560 92)" font-family="Arial,sans-serif">
    <rect width="530" height="536" rx="26" fill="#fff" stroke="#dfe7ef"/>
    <text x="56" y="64" font-size="12" font-weight="800" letter-spacing="1.4" fill="#2d6e9f">ACESSO À INTRANET</text>
    <text x="56" y="112" font-size="34" font-weight="800" fill="#183552">Bem-vindo ao Nexus</text>
    <text x="56" y="145" font-size="15" fill="#75879a">Use suas credenciais corporativas para continuar.</text>
    <g transform="translate(56 198)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#4e6276">E-mail</text>
      <rect x="0" y="18" width="418" height="58" rx="12" fill="#f8fafc" stroke="#cfd9e3"/>
      <text x="18" y="54" font-size="14" fill="#9aabba">nome@empresa.com.br</text>
    </g>
    <g transform="translate(56 302)">
      <text x="0" y="0" font-size="12" font-weight="700" fill="#4e6276">Senha</text>
      <rect x="0" y="18" width="418" height="58" rx="12" fill="#f8fafc" stroke="#cfd9e3"/>
      <text x="18" y="54" font-size="18" letter-spacing="4" fill="#788b9e">••••••••</text>
    </g>
    <rect x="56" y="418" width="418" height="58" rx="12" fill="#16588f"/>
    <text x="265" y="454" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">Entrar</text>
    <circle cx="70" cy="506" r="5" fill="#2b81bd"/><text x="86" y="511" font-size="12" fill="#718497">Ambiente interno · acesso restrito</text>
  </g>
</svg>