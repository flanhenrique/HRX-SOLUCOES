<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#061a31" />
  <title>Recuperar HRX Admin</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#061a31;color:#f4f8fc}
    body{min-height:100dvh;display:grid;place-items:center;padding:24px}
    main{width:min(480px,100%);padding:24px;border:1px solid rgba(183,213,242,.18);border-radius:22px;background:rgba(9,31,54,.92);box-shadow:0 24px 70px rgba(0,8,20,.38)}
    img{display:block;width:126px;max-width:45%;height:auto;margin:0 0 18px}
    h1{margin:0 0 10px;font-size:1.2rem}
    p{margin:0;color:#a9bfd2;font-size:.9rem;line-height:1.55}
    .progress{height:7px;margin-top:22px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
    .progress>span{display:block;width:24%;height:100%;border-radius:inherit;background:#4f8ef7;animation:progress 1.6s ease-in-out infinite alternate}
    small{display:block;margin-top:14px;color:#7390aa}
    @keyframes progress{to{transform:translateX(300%)}}
    @media(prefers-reduced-motion:reduce){.progress>span{animation:none;width:70%}}
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <img src="/hrx-logo.svg" alt="HRX Solutions" />
    <h1>Recuperando o HRX Admin</h1>
    <p id="status">Removendo a versão local antiga e preparando o aplicativo atualizado…</p>
    <div class="progress" aria-hidden="true"><span></span></div>
    <small>Se esta tela permanecer aberta por mais de alguns segundos, feche o HRX Admin instalado e volte para esta página.</small>
  </main>

  <script>
    (async () => {
      const status = document.getElementById('status')
      const setStatus = (message) => { if (status) status.textContent = message }

      try {
        setStatus('Desativando o service worker antigo…')
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations()
          await Promise.all(registrations.map(async (registration) => {
            try {
              const scope = new URL(registration.scope)
              if (scope.origin === location.origin && scope.pathname.startsWith('/admin/')) {
                await registration.unregister()
              }
            } catch {
              // Uma registration inválida não impede a limpeza das demais.
            }
          }))
        }

        setStatus('Limpando os pacotes antigos…')
        if ('caches' in window) {
          const names = await caches.keys()
          await Promise.all(names
            .filter((name) => name.startsWith('hrx-admin-atomic-') || name === 'hrx-admin-v3' || name === 'hrx-admin-v4')
            .map((name) => caches.delete(name)))
        }

        setStatus('Abrindo a versão atual…')
        const target = new URL('/admin/orcamentos', location.origin)
        target.searchParams.set('hrx-recovered', String(Date.now()))
        location.replace(target.toString())
      } catch (error) {
        console.error('HRX Admin recovery failed', error)
        setStatus('A limpeza automática não foi concluída. Feche o HRX Admin instalado, abra esta página novamente no Safari e tente outra vez.')
      }
    })()
  </script>
</body>
</html>
