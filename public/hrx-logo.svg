<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">HRX Solutions</title>
  <desc id="desc">Identidade visual HRX Solutions com monograma HRX metálico, X verde e assinatura Solutions.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#e7eaee"/>
      <stop offset="0.72" stop-color="#c9ced5"/>
      <stop offset="1" stop-color="#f8f9fb"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#57e38b"/>
      <stop offset="0.55" stop-color="#20bf6f"/>
      <stop offset="1" stop-color="#0b8f5a"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(78 42)">
    <!-- H -->
    <path fill="url(#silver)" d="M0 0h62v82h104V0h62v218h-62v-82H62v82H0z"/>

    <!-- R, geométrica como na proposta -->
    <path fill="url(#silver)" fill-rule="evenodd" d="M250 0h170c76 0 124 39 124 101 0 47-28 80-74 94l91 93h-82l-82-86h-85v86h-62V0zm62 55v94h103c43 0 65-16 65-47 0-31-22-47-65-47H312z"/>

    <!-- X verde + prata -->
    <g filter="url(#softGlow)">
      <path fill="url(#green)" d="M563 69l42-42 74 75 62-76 44 36-104 126-48-48z"/>
      <path fill="url(#green)" d="M565 206l43 43 74-75-42-43z"/>
      <path fill="url(#silver)" d="M690 149l42-44 95 113h-77z"/>
    </g>
  </g>

  <text x="500" y="307" text-anchor="middle" fill="#f5f7fa" font-family="Montserrat,Arial,sans-serif" font-size="48" font-weight="400" letter-spacing="22">SOLUTIONS</text>
  <rect x="450" y="333" width="100" height="4" rx="2" fill="url(#green)"/>
</svg>
